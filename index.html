  return n>=2&&!partial;
}
function villageOK(){
  if($('#villageNA').checked)return !!$('#villageReason').value.trim();
  return $$('.village-item').every(function(x){var s=$('.vstatus',x).value,t=$('.vtime',x).value,d=$('.vdetail',x).value.trim();return !!s&&(s==='N/A'||!!t)&&(s!=='Issue'||!!d)});
}
/* Lockup / unlock: the section (and each tab) turns green as soon as ANY one option has an entry:
   a time or N/A on any building in North or South, or text in Other. */
function sideDone(type,side){
  if(side==='Other')return !!String(lockState[type].Other||'').trim();
  var o=lockState[type][side]||{};
  return Object.keys(o).some(function(k){var x=o[k];return !!x&&(!!x.time||!!x.na)});
}
function locksOK(type){return sideDone(type,'North')||sideDone(type,'South')||sideDone(type,'Other')}
/* Re-read the visible lockup/unlock fields every update, so ticks never depend on one event firing. */
function syncLocks(){
  ['lockup','unlock'].forEach(function(type){
    var host=type==='lockup'?$('#lockupContent'):$('#unlockContent');
    var act=$('.tabs button.active[data-type="'+type+'"]');
    var side=act?act.getAttribute('data-side'):null;
    if(side&&side!=='Other'){
      $$('.lockcard',host).forEach(function(c){
        var k=c.getAttribute('data-key'),t=$('.ltime',c),n=$('.lna',c);
        if(k&&t&&n)lockState[type][side][k]={time:t.value,na:n.checked};
      });
    }
    var ot=$('.othertext',host);
    if(ot&&ot.tagName==='TEXTAREA')lockState[type].Other=ot.value;
  });
}

    case'Reportable duties':return dutyOK();

    case'Photo attachments':return photosOK();

  var pct=ss.length?Math.round(100*n/ss.length):0;
  $('#pct').textContent=pct+'%';$('#bar').style.width=pct+'%';$('#pdetail').textContent=n+' of '+ss.length+' sections complete';
  $$('.tabs button').forEach(function(b){b.classList.toggle('done',sideDone(b.getAttribute('data-type'),b.getAttribute('data-side')))});
  $$('.item').forEach(function(x){var s=$('select',x);if(s){x.classList.toggle('issue',s.value==='Issue');x.classList.toggle('ok',!!s.value&&s.value!=='Issue')}});
}

async function openPDF(print){
  var w=window.open('about:blank','_blank');
  if(!w){toast('Pop-up blocked. Allow pop-ups for this page, then try again.');return}
  w.document.write('<p style="font:15px Arial;padding:20px">Preparing checklist preview…</p>');
  try{var html=await buildPDF();w.document.open();w.document.write(html);w.document.close();if(print)setTimeout(function(){w.focus();w.print()},700)}
  catch(e){w.close();toast('Could not prepare the PDF: '+e.message)}
}
function allValid(){
  update();
  var inc=$$('.section').filter(function(s){return !s.classList.contains('defibhide')&&!sectionOK(s.getAttribute('data-name'))});
  if(inc.length){inc[0].open=true;inc[0].scrollIntoView({behavior:'smooth',block:'center'});toast(inc.length+' section'+(inc.length===1?'':'s')+' still need completion (opened the first one).');r[...]
  if(!$('#officer').value.trim()||!$('#role').value||!$('#shift').value||!$('#date').value){toast('Enter officer name, role, shift and date.');return false}
  return true;
}
function init(){
  var today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  $('#date').value=today;$('#signDate').value=today;
  makeItems(START_ITEMS,$('#startList'));
  makeItems(DEFIB_ITEMS,$('#defibList'));
  buildVillage();
  renderLock('lockup','North');renderLock('unlock','North');
  $('#addSet').addEventListener('click',function(){setCount=3;renderVehicle()});
  $('#removeSet').addEventListener('click',function(){
    var has=$$('#vehicleTable tbody tr').some(function(r){return $$('input',r).slice(4).some(function(i){return i.value})});
    if(has&&!confirm('Remove Set 3 and clear its times?'))return;
    setCount=2;renderVehicle();
  });
  $$('.tabs button').forEach(function(b){b.addEventListener('click',function(){syncLocks();renderLock(b.getAttribute('data-type'),b.getAttribute('data-side'));update()})});
  $('#patrolNA').addEventListener('change',function(){$('#patrolIssue').classList.toggle('on',$('#patrolNA').checked);update()});
  $('#villageNA').addEventListener('change',function(){$('#villageIssue').classList.toggle('on',$('#villageNA').checked);update()});
  $('#noDuties').addEventListener('change',function(){if($('#noDuties').checked&&$$('.duty').length){$('#noDuties').checked=false;toast('Remove the duty rows first.')}update()});
  $('#addDuty').addEventListener('click',addDuty);
  $('#noHandover').addEventListener('change',function(){if($('#noHandover').checked)$('#handoverNotes').value='';update()});
  $('#handoverNotes').addEventListener('input',function(){if($('#handoverNotes').value.trim())$('#noHandover').checked=false;update()});
  $('#noPhotos').addEventListener('change',function(){if($('#noPhotos').checked&&$$('.attach').length){$('#noPhotos').checked=false;toast('Remove the photos first.')}update()});
  cam=document.createElement('input');gal=document.createElement('input');
  [cam,gal].forEach(function(f){f.type='file';f.accept='image/*';f.multiple=true;f.className='filehide';document.body.appendChild(f)});
  cam.setAttribute('capture','environment');
  $('#cameraBtn').addEventListener('click',function(){cam.click()});
  $('#galleryBtn').addEventListener('click',function(){gal.click()});
  cam.addEventListener('change',function(){addPhotos(cam.files)});
  gal.addEventListener('change',function(){addPhotos(gal.files)});
  $('#date').addEventListener('change',checkDefib);$('#shift').addEventListener('change',checkDefib);
  $('#modalOK').addEventListener('click',function(){$('#defibModal').classList.remove('show')});
  $('#previewPDF').addEventListener('click',function(){openPDF(false)});
  $('#downloadPDF').addEventListener('click',function(){if(submitted)openPDF(true)});
  $('#saveDraft').addEventListener('click',function(){
    var f=$$('#app input:not([type=file]),#app select,#app textarea').map(function(x){return {key:x.id||x.getAttribute('aria-label')||x.placeholder,value:x.type==='checkbox'?x.checked:x.value}});
    try{localStorage.setItem('eso_daily_checklist_draft',JSON.stringify({savedAt:new Date().toISOString(),fields:f}));toast('Draft saved in this browser. Photos must be re-attached if you reopen [...]
  });
  $('#submit').addEventListener('click',function(){
    if(submitted)return;if(!allValid())return;if(!confirm('Submit and lock this checklist?'))return;
    submitted=true;$$('#editArea input,#editArea select,#editArea textarea,#editArea button').forEach(function(x){x.disabled=true});
    $('#completeBanner').classList.add('show');$('#downloadPDF').disabled=false;$('#submit').disabled=true;update();toast('Submitted. Download completed PDF is now available.');
  });
  document.addEventListener('input',function(){if(!submitted)update()});
  document.addEventListener('change',function(){if(!submitted)update()});
  renderVehicle();
  checkDefib();
  update();
}
init();
</script></body></html>
